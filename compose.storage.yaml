# Local/CI only. Production needs a separate reviewed network/CDN/secret overlay.
name: sineva-storage-local

x-storage: &storage
  image: chrislusf/seaweedfs:4.48
  restart: unless-stopped
  networks: [storage]

services:
  master:
    <<: *storage
    command:
      - master
      - -ip=master
      - -ip.bind=0.0.0.0
      - -mdir=/data
      - -volumeSizeLimitMB=128
      - -defaultReplication=000
    volumes:
      - master-data:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  volume:
    <<: *storage
    command:
      - volume
      - -ip=volume
      - -ip.bind=0.0.0.0
      - -port=8080
      - -master=master:9333
      - -dir=/data
      - -max=32
    volumes:
      - volume-data:/data
    depends_on:
      master:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  filer:
    <<: *storage
    command:
      - filer
      - -ip=filer
      - -ip.bind=0.0.0.0
      - -master=master:9333
      - -defaultStoreDir=/data/filerldb2
    volumes:
      - filer-data:/data
      - ./scripts/storage/filer.toml:/etc/seaweedfs/filer.toml:ro
    depends_on:
      volume:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8888/']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  s3:
    <<: *storage
    # Match the host owner of 0600 credentials; bypass the image UID 1000 switch.
    entrypoint: [/usr/bin/weed]
    user: '${STORAGE_UID:?Run storage:setup}:${STORAGE_GID:?Run storage:setup}'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - s3
      - -ip=s3
      - -ip.bind=0.0.0.0
      - -filer=filer:8888
      - -port.iceberg=0
      - -port.lance=0
      - -iam=false
      - -localSocket=/tmp/sineva-storage.sock
      - -config=/run/secrets/s3.json
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - type: bind
        source: ./.storage/secrets/s3.json
        target: /run/secrets/s3.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      filer:
        condition: service_healthy
    healthcheck:
      # An authenticated gateway must reject this anonymous request.
      test:
        [CMD-SHELL, 'wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q "403 Forbidden"']
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

networks:
  storage:
    internal: true

volumes:
  master-data:
  volume-data:
  filer-data:
